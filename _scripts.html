<script>
  // ── Theme Toggle ──
  const themeSwitch = document.getElementById('themeSwitch');
  const sunLabel    = document.getElementById('sunLabel');
  const moonLabel   = document.getElementById('moonLabel');
  const root        = document.documentElement;

  function updateToggleLabels() {
    if (!sunLabel || !moonLabel || !themeSwitch) return;
    const isDark = root.dataset.theme === 'dark';
    sunLabel.classList.toggle('active', !isDark);
    moonLabel.classList.toggle('active', isDark);
    themeSwitch.setAttribute('aria-checked', String(isDark));
    themeSwitch.setAttribute('aria-label', isDark ? 'Use light theme' : 'Use dark theme');
  }

  // Always read from localStorage and apply
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) {
      root.dataset.theme = saved;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.dataset.theme = 'dark';
    } else {
      root.dataset.theme = 'light';
    }
    updateToggleLabels();
  })();

  if (themeSwitch) {
    themeSwitch.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', root.dataset.theme);
      updateToggleLabels();
    });
  }

  // ── Nav scroll border ──
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // ── Mobile menu ──
  const menuBtn = document.getElementById('menuBtn');
  const navRight = document.getElementById('navRight');

  function setMenuOpen(isOpen) {
    navRight.classList.toggle('open', isOpen);
    menuBtn.setAttribute('aria-expanded', String(isOpen));
    menuBtn.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
  }

  menuBtn.addEventListener('click', () => {
    setMenuOpen(!navRight.classList.contains('open'));
  });

  navRight.querySelectorAll('a').forEach((link) => {
    link.addEventListener('click', () => setMenuOpen(false));
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') setMenuOpen(false);
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) setMenuOpen(false);
  }, { passive: true });

  // ── Scroll reveal ──
  const revealElements = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

    revealElements.forEach((el) => observer.observe(el));
  } else {
    revealElements.forEach((el) => el.classList.add('visible'));
  }
</script>
